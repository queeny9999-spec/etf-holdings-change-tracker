function changedRows(fund){return source[fund].rows.filter(r=>num(r[2])>1000||dates.some(d=>verifiedChanges[fund][d]?.[r[0]])).sort((a,b)=>num(b[3])-num(a[3]));}
function deltaClass(v){return v>0?'up':v<0?'down':''}
function stockName(code){for(const fund of fundOrder){const row=source[fund].rows.find(r=>r[0]===code);if(row)return row[1]}return code}
function stockDetail(code){const rows=fundOrder.flatMap(fund=>{const v=daily(fund)[code];return v?[{fund,v}]:[]});if(!rows.length)return '';return '<section class="detail"><h3>'+code+' '+stockName(code)+'</h3>'+rows.map(r=>'<div class="detail-row"><strong>'+r.fund+'</strong><span class="delta '+deltaClass(r.v)+'">'+(r.v>0?'+':'')+lots(r.v)+' 張</span></div>').join('')+'</section>'}
function activeView(){const f=source[activeFund],moves=daily(activeFund),rows=changedRows(activeFund);const heads=dates.map((d,i)=>'<th><span>'+d+'</span><small>'+(i===0?'最新':'週'+days[i])+'</small></th>').join('');const body=rows.map(r=>{const [code,name,shares,weight]=r,current=num(shares);const cells=dates.map(d=>{const v=verifiedChanges[activeFund][d]?.[code];if(v===undefined)return '<td class="blank">—</td>';if(v===0)return '<td></td>';const fresh=v>0&&current-v===0,dual=v>0&&dualBuys[d]?.has(code),tag=fresh?' <small>新建倉</small>':dual?' <small>雙檔買進</small>':'';return '<td class="delta '+deltaClass(v)+'">'+(v>0?'+':'')+lots(v)+' 張'+tag+'</td>'}).join('');return '<tr><td><button class="stock-btn" data-stock="'+code+'">'+code+'<span class="name">'+name+'</span></button></td><td>'+weight+'</td><td>'+lots(current)+' 張</td>'+cells+'</tr>'}).join('');return '<div class="tabs">'+fundOrder.map(code=>'<button class="tab '+(code===activeFund?'active':'')+'" data-fund="'+code+'">'+code+'</button>').join('')+'</div><section class="fund-head"><div><div class="fund-title">'+activeFund+'　'+f.name+'</div><div class="fund-meta">資料日期 '+f.date+'　｜　最新淨值 '+f.nav+'　｜　股票權重 '+f.stockWeight+'</div></div></section><section class="metrics"><div class="metric buy"><span>今日買進金額</span><strong>—</strong></div><div class="metric sell"><span>今日賣出金額</span><strong>—</strong></div><div class="metric"><span>淨買賣金額</span><strong>—</strong></div></section><section class="table-card"><div class="table-title">近十個營業日成分股異動</div><table><thead><tr><th>股票</th><th>最新權重</th><th>目前持有</th>'+heads+'</tr></thead><tbody>'+body+'</tbody></table></section>'+stockDetail(selectedStock)+'<div class="source">官方來源：<a href="'+officialLinks[activeFund]+'" target="_blank" rel="noreferrer">'+f.issuer+' '+activeFund+'</a></div>'}
